name: Publicar versão React no GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirme somente após backup restaurável, permissões/RLS revisadas e testes reais aprovados"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Auditar estrutura React, testes e build
        run: |
          node --check vite.config.js
          node --check scripts/check-project.mjs
          node scripts/check-project.mjs
          npm test
          npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-react

  deploy:
    if: ${{ inputs.confirm_publish == true }}
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
