name: Verificação do projeto

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validacao-projeto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Verificar sintaxe de configuração e auditoria
        run: |
          node --check vite.config.js
          node --check scripts/check-project.mjs
      - name: Auditar estrutura React e ausência de arquivos legados
        run: node scripts/check-project.mjs
      - name: Testar regras de negócio
        run: npm test
      - name: Construir as páginas React
        run: npm run build
