name: Verificação do projeto

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - migration/react-auth-dashboard-2026-10-22

jobs:
  syntax-and-react-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Verificar sintaxe do sistema atual
        run: |
          node --check app.js
          node --check sync.js
          node --check config.js
      - name: Construir versão React isolada
        run: npm run build
