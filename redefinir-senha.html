
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definir nova senha — R&R Transportes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f4f8;
      font-family: Arial, sans-serif;
      color: #243247;
    }
    .reset-card {
      box-sizing: border-box;
      width: min(420px, calc(100% - 32px));
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 35px #172b4d18;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { line-height: 1.5; color: #5b6678; }
    label { display: block; margin: 16px 0 6px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd3df;
      border-radius: 7px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #163a32;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Definir nova senha</h1>
    <p>Cadastre uma nova senha para acessar o sistema R&R Figueredo Transportes.</p>

    <form id="resetForm">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password"
        minlength="6" autocomplete="new-password" required>

      <label for="confirmPassword">Confirme a nova senha</label>
      <input id="confirmPassword" type="password"
        minlength="6" autocomplete="new-password" required>

      <button id="saveButton" type="submit">Salvar nova senha</button>
    </form>

    <p id="message" role="status"></p>
    <p id="loginLink" hidden>
      <a href="index.html">Voltar ao login</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.APP_CONFIG;
    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("saveButton");

    const supabaseClient = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    let ready = false;

    async function initialize() {
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      const type = url.searchParams.get("type");
      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );

      if (code) {
        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) throw error;
      } else if (hash.get("error_description")) {
        throw new Error(
          hash.get("error_description").replace(/\+/g, " ")
        );
      } else if (hash.get("access_token") &&
                 hash.get("refresh_token")) {
        const { error } = await supabaseClient.auth.setSession({
          access_token: hash.get("access_token"),
          refresh_token: hash.get("refresh_token")
        });
        if (error) throw error;
      }

      if (type && type !== "recovery") {
        throw new Error("Este link não é de recuperação de senha.");
      }

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) throw error;
      if (!data.session) {
        throw new Error(
          "Link inválido ou expirado. Solicite um novo e-mail de recuperação."
        );
      }

      ready = true;
      message.textContent = "Link validado. Escolha sua nova senha.";
    }

    initialize().catch(error => {
      message.textContent = error.message ||
        "Não foi possível validar o link.";
      form.hidden = true;
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!ready) return;

      const password =
        document.getElementById("newPassword").value;
      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        message.textContent =
          "A senha deve ter pelo menos 6 caracteres.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "As senhas não coincidem.";
        return;
      }

      button.disabled = true;
      message.textContent = "Salvando nova senha...";

      const { error } = await supabaseClient.auth.updateUser({
        password
      });

      if (error) {
        message.textContent = "Erro: " + error.message;
        button.disabled = false;
        return;
      }

      message.textContent =
        "Senha alterada com sucesso! Agora você pode entrar no sistema.";
      form.hidden = true;
      document.getElementById("loginLink").hidden = false;

      await supabaseClient.auth.signOut();
    });
  </script>
</body>
</html>
